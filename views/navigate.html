<!DOCTYPE html>
<html>
    <head>
        <title>VSC Navigator</title>
        <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
        <script>
            (async () => {
                const site = await (new JSZip()).loadAsync("{{SERVER_BUNDLE}}", {base64: true});
                document.querySelector("#frame").srcdoc = await site.file("index.html").async("string")
                window.addEventListener("message" , async (e) => {
                    alert(e)
                    switch(e.data.type) {
                        case "get_file":
                            e.source.postMessage({
                                type: "send_file",
                                body: await site.file(e.data.path).async("base64"),
                                path: e.data.path
                            })
                            break;
                    }
                })
            })()
        </script>
    </head>
    <body>
        <iframe id="frame"></iframe>
    </body>
</html>
